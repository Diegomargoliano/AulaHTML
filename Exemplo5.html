<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h1 {
            background-color: red;
            color: aliceblue;
            padding: 20px;
            text-align: center;
        }

        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }

        td {
            text-align: center;
        }
    </style>




</head>

<body>

    <table>
        <tr>

        </tr>

        <tr>
            <td>coluna 1</td>

        </tr>


        <tr>

            <td>coluna 3</td>
            <td>coluna4</td>
        </tr>

        <tr>

        </tr>

        <tr>

</html>
